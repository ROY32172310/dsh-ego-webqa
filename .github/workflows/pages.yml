name: pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "icon.svg"
      - "package.json"
      - "scripts/build-market-index.mjs"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build validated DSH market index
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" npm run market:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
