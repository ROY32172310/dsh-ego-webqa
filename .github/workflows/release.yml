name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/dsh-ego-webqa
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci --legacy-peer-deps
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run
      - name: Publish package
        run: npm publish --access public --provenance
      - name: Verify package is publicly visible
        shell: bash
        run: |
          set -euo pipefail
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          for attempt in $(seq 1 18); do
            published="$(npm view "${package}@${version}" version 2>/dev/null || true)"
            if [[ "$published" == "$version" ]]; then
              echo "Verified ${package}@${version} in the public npm registry."
              exit 0
            fi
            echo "Registry is not visible yet (attempt ${attempt}/18); retrying in 5s."
            sleep 5
          done

          echo "::error::${package}@${version} was not publicly visible after 90s."
          echo "::error::Check the Trusted Publisher's direct 'npm publish' permission; staged-only publishing must be approved manually."
          exit 1
